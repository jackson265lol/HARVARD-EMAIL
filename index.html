<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Terminal | Harvard University</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --crimson: #A51C30; --gold: #C4961A; --sidebar: #1a1a1a; --bg: #f5f5f7; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); overflow: hidden; }
        
        .app { display: grid; grid-template-columns: 240px 420px 1fr; height: 100vh; }
        
        /* Navigation */
        .nav { background: var(--sidebar); color: #fff; display: flex; flex-direction: column; padding: 25px 0; }
        .nav-logo { padding: 0 25px 25px; border-bottom: 1px solid #333; margin-bottom: 20px; font-family: 'Georgia', serif; font-size: 1.1rem; color: var(--crimson); font-weight: bold; }
        .nav-item { padding: 12px 25px; cursor: pointer; color: #888; display: flex; align-items: center; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover { color: #fff; background: #222; }
        .nav-item.active { background: var(--crimson); color: #fff; }
        .nav-item i { margin-right: 15px; width: 18px; text-align: center; }

        /* Inbox List */
        .inbox { background: white; border-right: 1px solid #ddd; overflow-y: auto; }
        .inbox-header { padding: 20px 25px; background: white; border-bottom: 2px solid #f0f0f0; position: sticky; top: 0; z-index: 10; font-weight: 800; font-size: 1.2rem; }
        .email-row { padding: 18px 25px; border-bottom: 1px solid #f8f8f8; cursor: pointer; border-left: 4px solid transparent; }
        .email-row:hover { background: #fafafa; }
        .email-row.active { background: #fff8f8; border-left-color: var(--crimson); }
        .sender { font-weight: 700; color: #333; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .sender span { font-weight: 400; color: #aaa; font-size: 0.75rem; }
        .subj { font-size: 0.85rem; color: #555; margin-top: 4px; font-weight: 500; }
        .prev { font-size: 0.8rem; color: #999; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Reading Pane */
        .workspace { background: white; display: flex; flex-direction: column; box-shadow: inset 10px 0 20px rgba(0,0,0,0.02); }
        .chat-area { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .msg { padding: 15px 22px; border-radius: 12px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; }
        .msg.ai { background: #f1f1f1; align-self: flex-start; color: #333; border: 1px solid #e0e0e0; }
        .msg.user { background: var(--crimson); color: white; align-self: flex-end; }
        .msg-header { font-size: 0.7rem; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; opacity: 0.6; letter-spacing: 0.5px; }

        /* Input */
        .input-bar { padding: 30px; border-top: 1px solid #eee; background: white; display: flex; gap: 15px; align-items: flex-end; }
        textarea { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 15px; height: 50px; resize: none; font-family: inherit; font-size: 0.95rem; background: #fafafa; transition: 0.2s; }
        textarea:focus { outline: none; border-color: var(--crimson); background: white; }
        .send-btn { background: var(--crimson); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .send-btn:hover { background: #8e1829; }
    </style>
</head>
<body>

<div class="app">
    <div class="nav">
        <div class="nav-logo">UNIVERSITY <span style="font-weight:200;color:#fff">TERMINAL</span></div>
        <div class="nav-item active"><i class="fas fa-inbox"></i> Inbox (102)</div>
        <div class="nav-item"><i class="fas fa-shield-alt"></i> Provost Direct</div>
        <div class="nav-item"><i class="fas fa-landmark"></i> SAA Internship</div>
        <div class="nav-item"><i class="fas fa-history"></i> History Minor</div>
    </div>

    <div class="inbox" id="inboxList">
        <div class="inbox-header">Strategic Mail</div>
    </div>

    <div class="workspace">
        <div class="chat-area" id="chatArea">
            <div style="text-align:center; color:#ccc; margin-top:150px;">
                <i class="fas fa-university fa-4x" style="margin-bottom:20px;"></i>
                <p>Welcome, Dean G.M. Select a thread to respond.</p>
            </div>
        </div>
        <div class="input-bar">
            <textarea id="userInput" placeholder="Draft your secure response..."></textarea>
            <button class="send-btn" onclick="handleSend()">SEND</button>
        </div>
    </div>
</div>

<script>
    // 100+ Emails generated automatically
    const baseEmails = [
        { id: 0, from: "Provost Office", sub: "Aristotle Curriculum Review", msg: "Dean, we are finalising the Spring 2027 syllabus. The Ethics committee is debating if we should prioritize Aristotle's Virtue Ethics or Mill's Utilitarianism. What is your final decision for the freshman core?" },
        { id: 1, from: "Registrar Office", sub: "Grade Discrepancy (91.59%)", msg: "A student is contesting a final grade in Comparative Politics. They are exactly at the 91.59% threshold for a GPA bump. Do we hold firm on the rounding policy?" },
        { id: 2, from: "Senate Sergeant at Arms", sub: "SAA Internship: Security Clearance", msg: "Dean, your summer internship onboarding requires a final signature on the Fairchild Building fingerprinting log. Please confirm this was completed on April 10th." },
        { id: 3, from: "Dept of History", sub: "History Minor Credits", msg: "We have reviewed your credit transfer request. Which elective from your second semester would you like to count toward the History Minor?" },
        { id: 4, from: "James (Cambridge)", sub: "Summer Housing Keys", msg: "Hey! Melinda says she can drop off the keys to the apartment whenever you're ready. Are you still planning on staying with me during the DC internship?" }
    ];

    // Generate 95 more filler emails
    const senders = ["Harvard Alumni", "Facilities Mgmt", "Endowment Board", "Crimson Newspaper", "Student Council"];
    const subjects = ["Meeting Request", "Budget Update", "Campus Safety", "Faculty Gala", "Library Access"];
    for(let i=5; i<105; i++){
        baseEmails.push({
            id: i,
            from: senders[i % senders.length],
            sub: `${subjects[i % subjects.length]} #${i+200}`,
            msg: "This is an automated executive notification regarding university operations. Please review the attached briefing at your earliest convenience."
        });
    }

    let activeId = null;

    function renderInbox() {
        const list = document.getElementById('inboxList');
        baseEmails.forEach(e => {
            const div = document.createElement('div');
            div.className = 'email-row';
            div.id = `row-${e.id}`;
            div.onclick = () => selectEmail(e.id);
            div.innerHTML = `
                <div class="sender">${e.from} <span>10:42 AM</span></div>
                <div class="subj">${e.sub}</div>
                <div class="prev">${e.msg}</div>
            `;
            list.appendChild(div);
        });
    }

    function selectEmail(id) {
        activeId = id;
        document.querySelectorAll('.email-row').forEach(r => r.classList.remove('active'));
        document.getElementById(`row-${id}`).classList.add('active');
        const chat = document.getElementById('chatArea');
        chat.innerHTML = `<div class="msg ai"><div class="msg-header">Original Message</div>${baseEmails[id].msg}</div><div id="thread"></div>`;
    }

    function handleSend() {
        const text = document.getElementById('userInput').value;
        if (!text || activeId === null) return;

        const thread = document.getElementById('thread');
        thread.innerHTML += `<div class="msg user"><div class="msg-header">Dean G.M.</div>${text}</div>`;
        document.getElementById('userInput').value = '';
        
        const chatArea = document.getElementById('chatArea');
        chatArea.scrollTop = chatArea.scrollHeight;

        // Smart Response Logic
        setTimeout(() => {
            let response = "";
            const input = text.toLowerCase();
            const currentSub = baseEmails[activeId].sub.toLowerCase();

            if (currentSub.includes("aristotle") || input.includes("aristotle") || input.includes("virtue")) {
                response = "The Provost's Office has received your feedback. We will prioritize the Nicomachean Ethics for the Spring term as per your recommendation.";
            } else if (currentSub.includes("grade") || input.includes("91.59") || input.includes("politics")) {
                response = "Understood. The 91.59% threshold will be maintained to preserve academic integrity. The Registrar's portal will reflect this within 24 hours.";
            } else if (currentSub.includes("saa") || input.includes("fingerprint") || input.includes("fairchild")) {
                response = "Thank you, Dean. The SAA HR department has matched your Fairchild fingerprint record. Your summer security badge is now pending printing.";
            } else if (currentSub.includes("housing") || input.includes("james") || input.includes("melinda")) {
                response = "James has been notified. Melinda will leave the keys in the secure drop-box at the Cambridge residence.";
            } else {
                response = "Your executive order has been logged. I have forwarded this correspondence to the relevant department for immediate action.";
            }

            thread.innerHTML += `<div class="msg ai"><div class="msg-header">System Assistant</div>${response}</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
        }, 1200);
    }

    renderInbox();
</script>

</body>
</html>
