<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Correspondence | Harvard University</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --crimson: #A51C30; --gold: #C4961A; --bg: #f4f1ea; --text: #293333; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); overflow: hidden; color: var(--text); }
        
        .app { display: grid; grid-template-columns: 260px 400px 1fr; height: 100vh; }
        
        /* Navigation Sidebar */
        .nav { background: #1a1a1a; color: #fff; display: flex; flex-direction: column; padding: 25px 0; }
        .nav-logo { padding: 0 25px 30px; border-bottom: 1px solid #333; margin-bottom: 20px; font-family: 'Georgia', serif; font-size: 1.2rem; color: var(--crimson); font-weight: bold; letter-spacing: 1px; }
        .nav-item { padding: 14px 25px; cursor: pointer; color: #999; transition: 0.2s; display: flex; align-items: center; font-size: 0.9rem; }
        .nav-item:hover { color: #fff; background: #2a2a2a; }
        .nav-item.active { background: var(--crimson); color: white; box-shadow: inset 4px 0 0 var(--gold); }
        .nav-item i { margin-right: 15px; width: 20px; text-align: center; }

        /* Email List */
        .inbox { background: white; border-right: 1px solid #ddd; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.02); }
        .inbox-header { padding: 25px; border-bottom: 2px solid var(--bg); background: white; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .email-row { padding: 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .email-row:hover { background: #fdfdfd; }
        .email-row.active { background: #fff9f9; border-left-color: var(--crimson); }
        .sender { font-weight: 700; color: var(--crimson); font-size: 0.95rem; margin-bottom: 4px; }
        .subj { font-size: 0.88rem; font-weight: 500; color: #444; margin-bottom: 6px; }
        .prev { font-size: 0.8rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Workspace & Chat */
        .workspace { display: flex; flex-direction: column; background: white; position: relative; }
        .chat-area { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #fff; }
        .msg { padding: 18px 22px; border-radius: 12px; max-width: 75%; line-height: 1.6; font-size: 0.95rem; position: relative; }
        .msg.ai { background: #f8f8f8; align-self: flex-start; border: 1px solid #eee; color: #333; }
        .msg.user { background: var(--crimson); color: white; align-self: flex-end; box-shadow: 0 4px 15px rgba(165, 28, 48, 0.15); }
        .msg-info { font-size: 0.75rem; margin-bottom: 6px; opacity: 0.7; font-weight: bold; text-transform: uppercase; }
        
        /* Input Area */
        .input-box { padding: 30px; border-top: 1px solid #eee; background: #fff; display: flex; gap: 15px; align-items: flex-end; }
        textarea { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 15px; height: 60px; resize: none; font-family: inherit; font-size: 0.95rem; transition: 0.2s; background: #fafafa; }
        textarea:focus { outline: none; border-color: var(--crimson); background: white; box-shadow: 0 0 0 3px rgba(165, 28, 48, 0.05); }
        .send-btn { background: var(--crimson); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: 700; letter-spacing: 1px; transition: 0.2s; }
        .send-btn:hover { background: #8e1829; transform: translateY(-1px); }

        .empty-state { text-align: center; color: #ccc; margin-top: 200px; }
        .status-pill { font-size: 0.7rem; background: var(--gold); color: white; padding: 2px 8px; border-radius: 10px; margin-left: 10px; vertical-align: middle; }
    </style>
</head>
<body>

<div class="app">
    <div class="nav">
        <div class="nav-logo">HARVARD <span style="font-weight:100; color:white;">EXEC</span></div>
        <div class="nav-item active"><i class="fas fa-shield-alt"></i> Secure Inbox</div>
        <div class="nav-item"><i class="fas fa-university"></i> Provost Memos</div>
        <div class="nav-item"><i class="fas fa-file-signature"></i> SAA Internship</div>
        <div class="nav-item"><i class="fas fa-user-friends"></i> Private (James)</div>
        <div class="nav-item"><i class="fas fa-cog"></i> Terminal Settings</div>
    </div>

    <div class="inbox" id="inboxList">
        <div class="inbox-header">
            <h2 style="margin:0; font-size: 1.2rem;">Correspondence</h2>
            <i class="fas fa-filter" style="color:#aaa; cursor:pointer;"></i>
        </div>
        </div>

    <div class="workspace">
        <div class="chat-area" id="chatArea">
            <div class="empty-state">
                <i class="fas fa-envelope-open-text fa-4x" style="margin-bottom:20px; opacity:0.5;"></i>
                <p>Select a priority thread to begin executive review.</p>
            </div>
        </div>
        <div class="input-box">
            <textarea id="userInput" placeholder="Compose secure response..."></textarea>
            <button class="send-btn" onclick="handleSend()">SEND</button>
        </div>
    </div>
</div>

<script>
    const emailData = [
        { id: 0, from: "Provost Office", sub: "Aristotle vs. Mill Seminar", msg: "Dean, the Faculty of Arts and Sciences is split on the moral philosophy curriculum. Some argue Mill's Utilitarianism is too focused on outcomes. What is your stance on Aristotle's virtue ethics for the freshman module?" },
        { id: 1, from: "Senate Sergeant at Arms", sub: "SAA Internship: HR Onboarding", msg: "Welcome to the team. Please confirm you have completed your fingerprinting at the Fairchild Building on April 10th. We need to finalize your summer access badge." },
        { id: 2, from: "Comparative Politics Dept", sub: "Grade Review: 91.59%", msg: "Regarding the final exam weighting—students are concerned the 91.59% threshold is too stringent. Do you authorize a curve adjustment for the Spring semester?" },
        { id: 3, from: "Melinda", sub: "Summer Housing & James", msg: "James mentioned you're staying with him again this summer. Should we coordinate the move-in for June, or wait until after your DC internship starts?" },
        { id: 4, from: "Registrar", sub: "History Minor Credits", msg: "We are processing your inquiry regarding course credits. Which specific History modules are you planning to apply toward your minor?" }
    ];

    let activeEmailId = null;

    function renderInbox() {
        const list = document.getElementById('inboxList');
        emailData.forEach(e => {
            const div = document.createElement('div');
            div.className = 'email-row';
            div.id = `email-${e.id}`;
            div.onclick = () => selectEmail(e.id);
            div.innerHTML = `
                <div class="sender">${e.from} ${e.id < 3 ? '<span class="status-pill">URGENT</span>' : ''}</div>
                <div class="subj">${e.sub}</div>
                <div class="prev">${e.msg}</div>
            `;
            list.appendChild(div);
        });
    }

    function selectEmail(id) {
        activeEmailId = id;
        document.querySelectorAll('.email-row').forEach(r => r.classList.remove('active'));
        document.getElementById(`email-${id}`).classList.add('active');
        
        const chat = document.getElementById('chatArea');
        chat.innerHTML = `
            <div class="msg ai">
                <div class="msg-info">ORIGINAL CORRESPONDENCE | FROM: ${emailData[id].from}</div>
                ${emailData[id].msg}
            </div>
        `;
        chat.scrollTop = 0;
    }

    function handleSend() {
        const text = document.getElementById('userInput').value;
        if (!text || activeEmailId === null) return;

        const chat = document.getElementById('chatArea');
        chat.innerHTML += `
            <div class="msg user">
                <div class="msg-info">EXECUTIVE RESPONSE | DEAN G.M.</div>
                ${text}
            </div>
        `;
        document.getElementById('userInput').value = '';
        chat.scrollTop = chat.scrollHeight;

        // Logic Engine: Response based on your specific keywords
        setTimeout(() => {
            let response = "";
            const input = text.toLowerCase();

            if (input.includes("aristotle") || input.includes("virtue")) {
                response = "An excellent point on eudaimonia. I agree that character-based ethics provide a more complete life-framework than simple utility. I'll pass this to the Provost.";
            } else if (input.includes("fingerprint") || input.includes("saa") || input.includes("fairchild")) {
                response = "Confirmed. We have noted your completion of the April 10th requirement. Your SAA HR file is now up to date for the summer internship.";
            } else if (input.includes("91.59") || input.includes("curve") || input.includes("politics")) {
                response = "I appreciate the feedback on the politics grading. I'll review the 91.59% threshold with the department head this afternoon.";
            } else if (input.includes("james") || input.includes("housing")) {
                response = "Copy that. We'll synchronize with James and Melinda to ensure the transition from Cambridge to DC is seamless.";
            } else {
                response = "Acknowledged. This response has been logged in the Harvard executive archives and routed to the appropriate department.";
            }

            chat.innerHTML += `
                <div class="msg ai">
                    <div class="msg-info">SECURE SYSTEM RESPONSE</div>
                    ${response}
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;
        }, 1500);
    }

    renderInbox();
</script>

</body>
</html>
